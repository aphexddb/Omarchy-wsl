# WSL configuration baked into the Omarchy image.
# See https://learn.microsoft.com/windows/wsl/wsl-config

[boot]
# Omarchy relies on systemd (services, user units, timers).
systemd=true

[user]
# Log in as the Omarchy user by default instead of root.
default=omarchy

[network]
generateHosts=true
generateResolvConf=true

[interop]
enabled=true
appendWindowsPath=false
