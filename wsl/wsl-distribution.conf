# /etc/wsl-distribution.conf
#
# Distribution-level configuration shared by BOTH Omarchy WSL distros
# (graphical desktop and basic). Identical on purpose: same registered name,
# same default user, same shortcut icon, same Windows Terminal profile.
#
# Docs: https://learn.microsoft.com/windows/wsl/build-custom-distro
# Owned by root:root, mode 0644 (enforced in the Dockerfile).

[oobe]
# First-run experience. Exits non-zero -> WSL refuses to open a shell.
command = /etc/oobe.sh
# The Omarchy user is baked in at uid 1000, so the OOBE just confirms it.
defaultUid = 1000
# Name the distro registers under (override at install time with --name).
defaultName = Omarchy

[shortcut]
enabled = true
icon = /usr/lib/wsl/omarchy.ico

[windowsterminal]
enabled = true
profileTemplate = /usr/lib/wsl/terminal-profile.json
